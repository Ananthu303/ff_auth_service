services:
  web:
    build: .
    container_name: auth_service
    command: bash -c "\
      python manage.py collectstatic --noinput && \
      python manage.py makemigrations && \
      python manage.py migrate --noinput && \
      gunicorn auth_service.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
